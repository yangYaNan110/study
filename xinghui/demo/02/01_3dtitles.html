<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>3D OBJ 111</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18.2/dist/lil-gui.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>
</head>

<body>
    <div id="map"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        import { MAPBOX_TOKEN } from '../public/token.js';

        import add3dtitles from './js/add3dtitles.js';

        const baseMapStyles = {
            '卫星影像': 'mapbox://styles/mapbox/satellite-v9',
            '卫星影像+标注': 'mapbox://styles/mapbox/satellite-streets-v12',
            '标准街道': 'mapbox://styles/mapbox/streets-v12',
            '浅色': 'mapbox://styles/mapbox/light-v11',
            '深色': 'mapbox://styles/mapbox/dark-v11',
        };

        let currentBaseMap = '卫星影像';

        const layerVisibility = {
            imageLayer: true,
            modelVisible: true,
        };

        const terrainParams = {
            enabled: true,
            exaggeration: 1.0,
        };

        const modelCenterParams = {
            x: -95.92740622846694,
            y: 41.11305358174491,
            z: 36,
        };

        const modelMoveParams = {
            step: 2,
            moveForward: () => moveModel(0, modelMoveParams.step, 0),
            moveBackward: () => moveModel(0, -modelMoveParams.step, 0),
            moveUp: () => moveModel(0, 0, modelMoveParams.step),
            moveDown: () => moveModel(0, 0, -modelMoveParams.step),
            moveLeft: () => moveModel(-modelMoveParams.step, 0, 0),
            moveRight: () => moveModel(modelMoveParams.step, 0, 0),
        };

        const imageSourceId = 'image-source';
        const imageLayerId = 'image-layer';
        const imageUrl = '../3dobj/dom/{z}/{x}/{y}.png';

        // 从模型元数据读取的精确原点；与控制面板的初始经纬度保持同一来源。
        const modelOrigin = [modelCenterParams.x, modelCenterParams.y];
        const modelAltitude = 0;
        const modelRotate = {
            x: 0,
            y: 0,
            z: 0,
        };

        let map = null;
        let customLayer = null;
        let scene = null;
        let renderer = null;
        let camera = null;
        let objModel = null;
        // OBJ 的地图坐标系根节点，负责自身的 T × R × S 变换。
        let modelFrame = null;

        /** 将地心地固坐标（ECEF，米）转换为经度、纬度和海拔。 */
        function ecefToLla(x, y, z) {
            const a = 6378137.0;
            const b = 6356752.314245;
            const e2 = 1 - (b * b) / (a * a);
            const ep2 = (a * a - b * b) / (b * b);
            const p = Math.sqrt(x * x + y * y);
            const theta = Math.atan2(z * a, p * b);
            const sinTheta = Math.sin(theta);
            const cosTheta = Math.cos(theta);
            const lon = Math.atan2(y, x);
            // Bowring 公式：使用 sin^3/cos^3 项，避免旧实现带来约 40m 的纬度误差。
            const lat = Math.atan2(
                z + ep2 * b * sinTheta * sinTheta * sinTheta,
                p - e2 * a * cosTheta * cosTheta * cosTheta
            );
            const N = a / Math.sqrt(1 - e2 * Math.sin(lat) * Math.sin(lat));
            const alt = p / Math.cos(lat) - N;
            return [lon * 180 / Math.PI, lat * 180 / Math.PI, alt];
        }

        /** 将经度、纬度、海拔（LLA）转换为地心地固坐标（ECEF，米）。 */
        function llaToEcef(lon, lat, alt) {
            const a = 6378137.0;
            const b = 6356752.314245;
            const e2 = 1 - (b * b) / (a * a);
            const lonRad = lon * Math.PI / 180;
            const latRad = lat * Math.PI / 180;
            const N = a / Math.sqrt(1 - e2 * Math.sin(latRad) * Math.sin(latRad));
            const x = (N + alt) * Math.cos(latRad) * Math.cos(lonRad);
            const y = (N + alt) * Math.cos(latRad) * Math.sin(lonRad);
            const z = (N * (1 - e2) + alt) * Math.sin(latRad);
            return [x, y, z];
        }

        /**
         * 将 OBJ 的 ENU 米坐标逐顶点投影到 Mapbox Mercator 坐标。
         *
         * 原来的做法是使用模型原点处的一个比例尺，将整个几公里范围的 OBJ 线性缩放。
         * 这里改为：ENU -> ECEF -> LLA -> Mercator。每个顶点使用自身的经纬度，
         * 因而不会因 Web Mercator 比例随纬度变化而造成模型两侧与中部对不齐。
         */
        function projectEnuVerticesToMercator(object) {
            // ENU 原点使用模型元数据中的精确经纬度与海拔。
            const [originEcefX, originEcefY, originEcefZ] = llaToEcef(
                modelOrigin[0],
                modelOrigin[1],
                modelAltitude
            );
            const longitude = modelOrigin[0] * Math.PI / 180;
            const latitude = modelOrigin[1] * Math.PI / 180;

            // 先定义 ENU 三个局部轴在 ECEF 中的方向。
            const eastAxis = new THREE.Vector3(
                -Math.sin(longitude),
                Math.cos(longitude),
                0
            );
            const northAxis = new THREE.Vector3(
                -Math.sin(latitude) * Math.cos(longitude),
                -Math.sin(latitude) * Math.sin(longitude),
                Math.cos(latitude)
            );
            const upAxis = new THREE.Vector3(
                Math.cos(latitude) * Math.cos(longitude),
                Math.cos(latitude) * Math.sin(longitude),
                Math.sin(latitude)
            );

            // 使用 Object3D 依次组织 ENU→ECEF 的缩放、旋转和平移：
            // 1. ENU 坐标本身已经是米，缩放为 1；
            // 2. 旋转使局部 X/Y/Z 对应 ECEF 中的东/北/天轴；
            // 3. 平移到模型原点的 ECEF 位置。
            const enuFrame = new THREE.Object3D();
            const enuRotation = new THREE.Matrix4().makeBasis(
                eastAxis,
                northAxis,
                upAxis
            );
            enuFrame.rotation.setFromRotationMatrix(enuRotation);
            enuFrame.scale.set(1, 1, 1);
            enuFrame.position.set(originEcefX, originEcefY, originEcefZ);
            enuFrame.updateMatrix();

            // Object3D.matrix 即 ENU→ECEF 齐次变换矩阵：T × R × S。
            // 对列向量顶点而言，右侧矩阵先执行，因此实际顺序是：先 S 缩放、再 R 旋转、最后 T 平移。
            const enuToEcef = enuFrame.matrix.clone();

            // 以模型原点为锚点存储相对 Mercator 坐标；渲染时再整体平移到地图位置。
            const mercatorOrigin = mapboxgl.MercatorCoordinate.fromLngLat(
                modelOrigin,
                modelAltitude
            );

            

            object.traverse((child) => {
                if (!child.isMesh || !child.geometry?.attributes?.position) return;

                const position = child.geometry.attributes.position;
                // 复用向量对象，避免遍历大量顶点时反复创建对象。
                const ecefVertex = new THREE.Vector3();

                // 对每个 ENU 顶点执行精确的地球坐标与投影转换。
                for (let index = 0; index < position.count; index += 1) {
                    const eastMeters = position.getX(index);
                    const northMeters = position.getY(index);
                    const upMeters = position.getZ(index);

                    // 将当前 ENU 米坐标应用 ENU→ECEF 矩阵，得到地心地固坐标。
                    ecefVertex
                        .set(eastMeters, northMeters, upMeters)
                        .applyMatrix4(enuToEcef);

                    const [vertexLon, vertexLat, vertexAltitude] = ecefToLla(
                        ecefVertex.x,
                        ecefVertex.y,
                        ecefVertex.z
                    );
                    const vertexMercator = mapboxgl.MercatorCoordinate.fromLngLat(
                        [vertexLon, vertexLat],
                        vertexAltitude
                    );

                    position.setXYZ(
                        index,
                        vertexMercator.x - mercatorOrigin.x,
                        vertexMercator.y - mercatorOrigin.y,
                        vertexMercator.z - mercatorOrigin.z
                    );
                }

                // 通知 Three.js 顶点缓冲区已被改写，并重建包围体。
                position.needsUpdate = true;
                child.geometry.computeBoundingBox();
                child.geometry.computeBoundingSphere();
            });
        }

        /** 在控制台输出当前地图视角、模型位置/可见性和地形配置，便于调试。 */
        function logMapState() {
            if (!map) return;
            const mapState = {
                map: {
                    zoom: map.getZoom(),
                    pitch: map.getPitch(),
                    bearing: map.getBearing(),
                    center: map.getCenter().toArray(),
                },
                model: {
                    visible: layerVisibility.modelVisible,
                    center: {
                        lon: modelCenterParams.x,
                        lat: modelCenterParams.y,
                        height: modelCenterParams.z,
                        ecef: llaToEcef(modelCenterParams.x, modelCenterParams.y, modelCenterParams.z),
                    },
                },
                terrain: {
                    enabled: terrainParams.enabled,
                    exaggeration: terrainParams.exaggeration,
                },
            };
            // console.log('=== 地图状态 ===', mapState);
        }

        /** 创建 Mapbox 地图，并在样式加载后挂载影像、地形、Three.js 模型和控制面板。 */
        function init() {
            map = new mapboxgl.Map({
                accessToken: MAPBOX_TOKEN,
                container: 'map',
                style: baseMapStyles[currentBaseMap],
                zoom: 13,
                center: [-95.904606, 41.116996],
                pitch: 0,
                antialias: true,
            });

            map.on('style.load', () => {
                addImageLayer();
                addTerrain();
                addCustomLayer();
                // addGUI();

            });
            map.on('load', () => {
                applyModelCenter();
            })
            map.on('zoom', logMapState);
            map.on('move', logMapState);
        }

        /** 注册本地瓦片影像源，并按当前配置添加或恢复其栅格图层。 */
        function addImageLayer() {
            if (!map.getSource(imageSourceId)) {
                map.addSource(imageSourceId, {
                    type: 'raster',
                    tiles: [imageUrl],
                    tileSize: 256,
                });
            }

            if (!map.getLayer(imageLayerId)) {
                map.addLayer({
                    id: imageLayerId,
                    type: 'raster',
                    source: imageSourceId,
                    layout: {
                        visibility: layerVisibility.imageLayer ? 'visible' : 'none',
                    },
                });
            }
        }

        /** 注册 Mapbox DEM 高程数据源，并根据开关启用或关闭三维地形。 */
        function addTerrain() {
            if (!map.getSource('mapbox-dem')) {
                map.addSource('mapbox-dem', {
                    type: 'raster-dem',
                    url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
                    tileSize: 512,
                    maxzoom: 14,
                });
            }

            if (terrainParams.enabled) {
                map.setTerrain({
                    source: 'mapbox-dem',
                    exaggeration: terrainParams.exaggeration,
                });
            } else {
                map.setTerrain(null);
            }
        }

        /** 在地形已启用时，更新地形的垂直夸张倍数。 */
        function updateTerrainExaggeration(value) {
            if (terrainParams.enabled) {
                map.setTerrain({
                    source: 'mapbox-dem',
                    exaggeration: value,
                });
            }
        }

        /** 根据控制面板的开关启用或清除地图地形。 */
        function toggleTerrain(enabled) {
            if (enabled) {
                map.setTerrain({
                    source: 'mapbox-dem',
                    exaggeration: terrainParams.exaggeration,
                });
            } else {
                map.setTerrain(null);
            }
        }

        /** 切换本地栅格影像图层的显示状态。 */
        function toggleImageLayer(visible) {
            if (map.getLayer(imageLayerId)) {
                map.setLayoutProperty(imageLayerId, 'visibility', visible ? 'visible' : 'none');
            }
        }

        /** 切换已加载 OBJ 模型的显示状态，并记录当前状态。 */
        function toggleModelVisible(visible) {
            console.log("切换模型显示隐藏....yyn");

            if (modelFrame) {
                modelFrame.visible = visible;
            }
            logMapState();
        }

        /** 将面板中的经纬度和高度转换为墨卡托坐标，作为模型的新定位点。 */
        function applyModelCenter() {
            if (!map || !modelFrame) return;

            const modelAsMercatorCoordinate = mapboxgl.MercatorCoordinate.fromLngLat(
                [modelCenterParams.x, modelCenterParams.y],
                modelCenterParams.z
            );

            modelFrame.position.set(
                modelAsMercatorCoordinate.x,
                modelAsMercatorCoordinate.y,
                modelAsMercatorCoordinate.z
            );
            modelFrame.rotation.set(modelRotate.x, modelRotate.y, modelRotate.z);
            modelFrame.scale.set(1, 1, 1);
            // 与 enuFrame 一样，Object3D 在此生成自身的 T × R × S 矩阵。
            modelFrame.updateMatrix();

            logMapState();
        }

        /**
         * 按米移动模型：先在墨卡托坐标中偏移，再同步回经纬度、高度和渲染变换。
         * dx、dy、dz 分别表示东西、南北和垂直方向的位移。
         */
        function moveModel(dx, dy, dz) {
            if (!map || !modelFrame) return;

            const currentMercator = mapboxgl.MercatorCoordinate.fromLngLat(
                [modelCenterParams.x, modelCenterParams.y],
                modelCenterParams.z
            );

            const scale = currentMercator.meterInMercatorCoordinateUnits();

            const newX = currentMercator.x + dx * scale;
            const newY = currentMercator.y + dy * scale;
            const newZ = currentMercator.z + dz * scale;

            const newMercator = new mapboxgl.MercatorCoordinate(newX, newY, newZ);
            const newLngLat = newMercator.toLngLat();

            modelCenterParams.x = newLngLat.lng;
            modelCenterParams.y = newLngLat.lat;
            modelCenterParams.z = newMercator.toAltitude();

            modelFrame.position.set(newX, newY, newZ);
            modelFrame.updateMatrix();

            logMapState();
        }

        /** 切换 Mapbox 底图样式，并在新样式就绪后重新添加自定义影像和地形。 */
        function changeBaseMap(styleName) {
            const styleUrl = baseMapStyles[styleName];
            if (styleUrl) {
                currentBaseMap = styleName;
                map.setStyle(styleUrl, {
                    preserve: ['camera', 'sprite'],
                });

                map.once('styledata', () => {
                    addImageLayer();
                    addTerrain();
                });
            }
        }

        /** 加载当前目标 OBJ，并用独立 Object3D 保存它的地图坐标变换。 */
        function addTargetModel() {
            const modelAsMercatorCoordinate = mapboxgl.MercatorCoordinate.fromLngLat(
                modelOrigin,
                modelAltitude
            );

            // 和 enuFrame 相同：Object3D 通过 position、rotation、scale 生成 T × R × S。
            modelFrame = new THREE.Object3D();
            modelFrame.name = 'target-model-frame';
            modelFrame.position.set(
                modelAsMercatorCoordinate.x,
                modelAsMercatorCoordinate.y,
                modelAsMercatorCoordinate.z
            );
            modelFrame.rotation.set(modelRotate.x, modelRotate.y, modelRotate.z);
            modelFrame.scale.set(1, 1, 1);
            modelFrame.updateMatrix();
            scene.add(modelFrame);

            const loader = new OBJLoader();
            loader.load(
                "../落汤鸡/目标三维模型-精模/目标1三维模型-精模.obj",
                (object) => {
                    console.log('object', object);
                    objModel = object;
                    projectEnuVerticesToMercator(object);
                    object.traverse((child) => {
                        if (!child.isMesh) return;

                        // child.material = new THREE.MeshStandardMaterial({
                            // 
                        child.material = new THREE.MeshBasicMaterial({

                            color: 0xffaa00,
                            roughness: 0.8,
                            metalness: 0.2,
                        });
                        child.frustumCulled = false;
                    });
                    // OBJ 顶点相对原点存储；整体平移和旋转只由 modelFrame 承担。
                    modelFrame.add(object);
                    // applyModelCenter();
                    console.log('OBJ model loaded successfully');
                    logMapState();
                },
                (xhr) => {
                    console.log('Loading OBJ model:', (xhr.loaded / xhr.total * 100) + '%');
                },
                (error) => {
                    console.error('Error loading OBJ model:', error);
                }
            );
        }

        /**
         * 创建 Mapbox Custom Layer：初始化 Three.js 场景，并在每帧将其绘制到地图画布。
         */
        function addCustomLayer() {

            // 定义符合 Mapbox Custom Layer 规范的三维图层。
            customLayer = {
                // 图层的唯一标识。
                id: '3d-model',
                // 声明为自定义图层。
                type: 'custom',
                // 声明为 3D 渲染，使其参与地图的三维渲染流程。
                renderingMode: '3d',
                /** 图层加入地图时初始化 Three.js 渲染环境和 OBJ 模型。 */
                onAdd: function (map, gl) {
                    // 创建相机；投影矩阵会在 render 中由 Mapbox 的矩阵更新。
                    camera = new THREE.Camera();
                    // 创建承载灯光和 OBJ 模型的 Three.js 场景。
                    scene = new THREE.Scene();
                    // 复用 Mapbox 的画布和 WebGL 上下文创建 Three.js 渲染器。
                    renderer = new THREE.WebGLRenderer({
                        canvas: map.getCanvas(),
                        context: gl,
                        antialias: true,
                    });

                    // 禁止 Three.js 自动清空画布，保留 Mapbox 已绘制的地图内容。
                    renderer.autoClear = false;
                    // 添加第一盏平行光，为模型提供一个方向上的主光照。
                    const directionalLight = new THREE.DirectionalLight(0xffffff);
                    // 设置光源位置并归一化方向向量。
                    directionalLight.position.set(0, -70, 100).normalize();
                    // 将主光源加入场景。
                    scene.add(directionalLight);

                    // 添加另一侧的平行光，减少模型背面的阴暗区域。
                    const directionalLight2 = new THREE.DirectionalLight(0xffffff);
                    // 设置第二盏平行光的位置并归一化其方向。
                    directionalLight2.position.set(0, 70, 100).normalize();
                    // 将第二盏平行光加入场景。
                    scene.add(directionalLight2);

                    // 添加环境光，为所有表面提供基础亮度。
                    const ambientLight = new THREE.AmbientLight(0x404040);
                    // 将环境光加入场景。
                    scene.add(ambientLight);

                    // 后续新增 OBJ 时，只需继续调用类似 addTargetModel 的独立函数。
                    // addTargetModel();
                    add3dtitles(camera, renderer, scene, map);

                    // 保存地图实例，以便 render 中请求下一帧重绘。
                    this.map = map;

                    

                },
                /** 每帧同步 Mapbox 的视图投影矩阵，然后重绘 Three.js 场景。 */
                render: function (gl, matrix) {
                    // Mapbox 提供的是 VP；模型的 M 已由 modelFrame.matrixWorld 提供。
                    camera.projectionMatrix.fromArray(matrix);
                    // 重置 Three.js 的 WebGL 状态，避免与 Mapbox 的状态相互干扰。
                    renderer.resetState();
                    // 使用共享画布将 Three.js 场景绘制到当前地图帧中。
                    renderer.render(scene, camera);
                    // 请求 Mapbox 继续重绘，以支持相机移动和模型参数实时更新。
                    this.map.triggerRepaint();
                },
            };

            // 将定义好的自定义三维图层注册到 Mapbox 地图中。
            map.addLayer(customLayer);
        }

        /** 创建 lil-gui 控制面板，用于实时调整底图、图层、模型位置/旋转和地形。 */
        function addGUI() {
            const gui = new lil.GUI();
            gui.width = 300;

            const baseMapOptions = gui.addFolder('Base Map');
            baseMapOptions.add({ style: currentBaseMap }, 'style', Object.keys(baseMapStyles)).name('底图样式').onChange(changeBaseMap);
            baseMapOptions.open();

            const layerOptions = gui.addFolder('Layer Visibility');
            layerOptions.add(layerVisibility, 'imageLayer').name('Image Layer').onChange(toggleImageLayer);
            layerOptions.add(layerVisibility, 'modelVisible').name('Model').onChange(toggleModelVisible);
            layerOptions.open();

            const modelCenterOptions = gui.addFolder('Model Center');
            modelCenterOptions.add(modelCenterParams, 'x').name('X').step(0.0001);
            modelCenterOptions.add(modelCenterParams, 'y').name('Y').step(0.0001);
            modelCenterOptions.add(modelCenterParams, 'z').name('Z').step(0.1);
            modelCenterOptions.add({ apply: applyModelCenter }, 'apply').name('应用');
            modelCenterOptions.open();

            const modelMoveOptions = gui.addFolder('Model Position');
            modelMoveOptions.add(modelMoveParams, 'step').name('步长 (m)').min(0.1).max(100).step(0.1);
            modelMoveOptions.add(modelMoveParams, 'moveForward').name('前');
            modelMoveOptions.add(modelMoveParams, 'moveBackward').name('后');
            modelMoveOptions.add(modelMoveParams, 'moveUp').name('上');
            modelMoveOptions.add(modelMoveParams, 'moveDown').name('下');
            modelMoveOptions.add(modelMoveParams, 'moveLeft').name('左');
            modelMoveOptions.add(modelMoveParams, 'moveRight').name('右');
            modelMoveOptions.open();

            const modelRotateOptions = gui.addFolder('Model Rotation');
            modelRotateOptions.add(modelRotate, 'x').name('Rotate X').min(-Math.PI).max(Math.PI).step(0.01);
            modelRotateOptions.add(modelRotate, 'y').name('Rotate Y').min(-Math.PI).max(Math.PI).step(0.01);
            modelRotateOptions.add(modelRotate, 'z').name('Rotate Z').min(-Math.PI).max(Math.PI).step(0.01);
            modelRotateOptions.open();

            const terrainOptions = gui.addFolder('Terrain Options');
            terrainOptions.add(terrainParams, 'enabled').name('Terrain').onChange(toggleTerrain);
            terrainOptions.add(terrainParams, 'exaggeration').name('Exaggeration').min(0).max(5).step(0.1).onChange(updateTerrainExaggeration);
            terrainOptions.open();

            gui.open();
        }

        init();
    </script>

</body>

</html>
