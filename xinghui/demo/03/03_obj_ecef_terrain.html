<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>加载ecef+地形 解决高层级地形性能问题</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18.2/dist/lil-gui.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>
</head>

<body>
    <div id="map"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        import { MAPBOX_TOKEN } from '../public/token.js';



        const baseMapStyles = {
            '卫星影像': 'mapbox://styles/mapbox/satellite-v9',
            '卫星影像+标注': 'mapbox://styles/mapbox/satellite-streets-v12',
            '标准街道': 'mapbox://styles/mapbox/streets-v12',
            '浅色': 'mapbox://styles/mapbox/light-v11',
            '深色': 'mapbox://styles/mapbox/dark-v11',
        };

        let currentBaseMap = '卫星影像';

        const layerVisibility = {
            imageLayer: true,
            modelVisible: true,
        };

        const terrainParams = {
            enabled: true,
            exaggeration: 1.0,
        };

        const modelCenterParams = {
            x: -95.92740622846694,
            y: 41.11305358174491,
            z: 0,
        };

        const modelMoveParams = {
            step: 2,
            moveForward: () => moveModel(0, modelMoveParams.step, 0),
            moveBackward: () => moveModel(0, -modelMoveParams.step, 0),
            moveUp: () => moveModel(0, 0, modelMoveParams.step),
            moveDown: () => moveModel(0, 0, -modelMoveParams.step),
            moveLeft: () => moveModel(-modelMoveParams.step, 0, 0),
            moveRight: () => moveModel(modelMoveParams.step, 0, 0),
        };

        const imageSourceId = 'image-source';
        const imageLayerId = 'image-layer';
        const imageUrl = '../3dobj/dom/{z}/{x}/{y}.png';

        // 从模型元数据读取的精确原点；与控制面板的初始经纬度保持同一来源。
        const modelOrigin = [modelCenterParams.x, modelCenterParams.y];
        const modelAltitude = 0;
        const modelRotate = {
            x: 0,
            y: 0,
            z: 0,
        };

        let map = null;
        let customLayer = null;
        let scene = null;
        let renderer = null;
        let camera = null;
        let objModel = null;
        let modelTransform = {};
        const offsetX = -496845.585, offsetY = -4787606.399, offsetZ = 4171388.400;


        /** 将地心地固坐标（ECEF，米）转换为经度、纬度和海拔。 */
        function ecefToLla(x, y, z) {
            const a = 6378137.0;
            const b = 6356752.314245;
            const e2 = 1 - (b * b) / (a * a);
            const ep2 = (a * a - b * b) / (b * b);
            const p = Math.sqrt(x * x + y * y);
            const theta = Math.atan2(z * a, p * b);
            const sinTheta = Math.sin(theta);
            const cosTheta = Math.cos(theta);
            const lon = Math.atan2(y, x);
            // Bowring 公式：使用 sin^3/cos^3 项，避免旧实现带来约 40m 的纬度误差。
            const lat = Math.atan2(
                z + ep2 * b * sinTheta * sinTheta * sinTheta,
                p - e2 * a * cosTheta * cosTheta * cosTheta
            );
            const N = a / Math.sqrt(1 - e2 * Math.sin(lat) * Math.sin(lat));
            const alt = p / Math.cos(lat) - N;
            return [lon * 180 / Math.PI, lat * 180 / Math.PI, alt];
        }

        /** 将经度、纬度、海拔（LLA）转换为地心地固坐标（ECEF，米）。 */
        function llaToEcef(lon, lat, alt) {
            const a = 6378137.0;
            const b = 6356752.314245;
            const e2 = 1 - (b * b) / (a * a);
            const lonRad = lon * Math.PI / 180;
            const latRad = lat * Math.PI / 180;
            const N = a / Math.sqrt(1 - e2 * Math.sin(latRad) * Math.sin(latRad));
            const x = (N + alt) * Math.cos(latRad) * Math.cos(lonRad);
            const y = (N + alt) * Math.cos(latRad) * Math.sin(lonRad);
            const z = (N * (1 - e2) + alt) * Math.sin(latRad);
            return [x, y, z];
        }

        /**
         * 将 OBJ 的 ECEF 米坐标逐顶点投影到 Mapbox Mercator 坐标。
         *
         * 原来的做法是使用模型原点处的一个比例尺，将整个几公里范围的 OBJ 线性缩放。
         * 这里改为：ECEF -> LLA -> Mercator。每个顶点使用自身的经纬度，
         * 因而不会因 Web Mercator 比例随纬度变化而造成模型两侧与中部对不齐。
         */
        function projectEnuVerticesToMercator(object) {
            
            // 以模型原点为锚点存储相对 Mercator 坐标；渲染时再整体平移到地图位置。
            const mercatorOrigin = mapboxgl.MercatorCoordinate.fromLngLat(
                modelOrigin,
                modelAltitude
            );
            object.traverse((child) => {
                if (!child.isMesh || !child.geometry?.attributes?.position) return;

                const position = child.geometry.attributes.position;
                // 复用向量对象，避免遍历大量顶点时反复创建对象。
                const ecefVertex = new THREE.Vector3();
                // console.log('=== 顶点 ===', position);
                // # offset_x = -496845.585
                // # offset_y = -4787606.399
                // # offset_z = 4171388.400
                //得到的就是ecef坐标了
                for (let index = 0; index < position.count; index += 1) {
                    const eastMeters = position.getX(index);
                    const northMeters = position.getY(index);
                    const upMeters = position.getZ(index);
                    ecefVertex
                        .set(eastMeters+offsetX, northMeters+offsetY, upMeters+offsetZ)

                    const [vertexLon, vertexLat, vertexAltitude] = ecefToLla(
                        ecefVertex.x,
                        ecefVertex.y,
                        ecefVertex.z
                    );
                    const vertexMercator = mapboxgl.MercatorCoordinate.fromLngLat(
                        [vertexLon, vertexLat],
                        vertexAltitude
                    );

                    position.setXYZ(
                        index,
                        vertexMercator.x - mercatorOrigin.x,
                        vertexMercator.y - mercatorOrigin.y,
                        vertexMercator.z - mercatorOrigin.z
                    );
                }

                // 顶点经过 ECEF -> Mercator 的非线性转换后，原 OBJ 法线已不再可靠。
                // 按转换后的三角面重算法线，避免光照计算将局部面渲染为黑色。
                position.needsUpdate = true;
                child.geometry.computeVertexNormals();
                child.geometry.computeBoundingBox();
                child.geometry.computeBoundingSphere();
            });
        }

        /** 在控制台输出当前地图视角、模型位置/可见性和地形配置，便于调试。 */
        function logMapState() {
            if (!map) return;
            const mapState = {
                map: {
                    zoom: map.getZoom(),
                    pitch: map.getPitch(),
                    bearing: map.getBearing(),
                    center: map.getCenter().toArray(),
                },
                model: {
                    visible: layerVisibility.modelVisible,
                    center: {
                        lon: modelCenterParams.x,
                        lat: modelCenterParams.y,
                        height: modelCenterParams.z,
                        ecef: llaToEcef(modelCenterParams.x, modelCenterParams.y, modelCenterParams.z),
                    },
                },
                terrain: {
                    enabled: terrainParams.enabled,
                    exaggeration: terrainParams.exaggeration,
                },
            };
        }

        /** 创建 Mapbox 地图，并在样式加载后挂载影像、地形、Three.js 模型和控制面板。 */
        function init() {
            map = new mapboxgl.Map({
                accessToken: MAPBOX_TOKEN,
                container: 'map',
                style: baseMapStyles[currentBaseMap],
                zoom: 13,
                center: [-95.904606, 41.116996],
                pitch: 0,
                antialias: true,
            });

            map.on('style.load', () => {
                map.transform.setOrthographicProjectionAtLowPitch(true);

                addImageLayer();
                addTerrain();
                addCustomECEFObjLayer();
                // addGUI();

            });
            map.on('load', () => {
                applyModelCenter();
            })
            map.on('zoom', logMapState);
            map.on('move', logMapState);
            installTerrainCoverDiagnostics();

        }

        /** 注册本地瓦片影像源，并按当前配置添加或恢复其栅格图层。 */
        function addImageLayer() {
            if (!map.getSource(imageSourceId)) {
                map.addSource(imageSourceId, {
                    type: 'raster',
                    tiles: [imageUrl],
                    tileSize: 256,
                });
            }

            if (!map.getLayer(imageLayerId)) {
                map.addLayer({
                    id: imageLayerId,
                    type: 'raster',
                    source: imageSourceId,
                    layout: {
                        visibility: layerVisibility.imageLayer ? 'visible' : 'none',
                    },
                });
            }
        }

        /** 注册与测绘模型同批次产出的本地 DEM，并根据开关启用或关闭三维地形。 */
        function addTerrain() {
            //study/xinghui/demo/01/落汤鸡/单目标DEM/dem_wgs84/10/238/383.png
            if (!map.getSource('local-model-dem')) {
                console.log('addTerrain:::yyn...');
                map.addSource('local-model-dem', {

                    type: 'raster-dem',
                    // dem_wgs84.tif 已切为 Mapbox Terrain-RGB 瓦片；RGB 可还原为米单位高程。
                    // 它与 OBJ、DOM 是同一测绘成果，避免使用 Mapbox 全球 DEM 带来的局部起伏差异。
                    // study/xinghui/demo/01
                    // study/xinghui/demo/01/3dobj/tiles/13/1911/3066.png
                    // raster-dem 在 Mapbox Worker 中加载，需使用绝对 URL。
                    // 仅转换目录前缀；若将 {z}/{x}/{y} 直接传给 URL()，会被编码为 %7Bz%7D。
                    tiles: [
                        `${new URL('../3dobj/tiles/', window.location.href).href}{z}/{x}/{y}.png`,
                    ],
                    tileSize: 512,
                    encoding: 'mapbox',
                    minzoom: 0,
                    maxzoom: 15,
                });
            }

            if (terrainParams.enabled) {
                map.setTerrain({
                    source: 'local-model-dem',
                    exaggeration: terrainParams.exaggeration,
                });
            } else {
                map.setTerrain(null);
            }
        }

        /** 在地形已启用时，更新地形的垂直夸张倍数。 */
        function updateTerrainExaggeration(value) {
            if (terrainParams.enabled) {
                map.setTerrain({
                    source: 'local-model-dem',
                    exaggeration: value,
                });
            }
        }

        /** 根据控制面板的开关启用或清除地图地形。 */
        function toggleTerrain(enabled) {
            if (enabled) {
                map.setTerrain({
                    source: 'local-model-dem',
                    exaggeration: terrainParams.exaggeration,
                });
            } else {
                map.setTerrain(null);
            }
        }

        /** 切换本地栅格影像图层的显示状态。 */
        function toggleImageLayer(visible) {
            if (map.getLayer(imageLayerId)) {
                map.setLayoutProperty(imageLayerId, 'visibility', visible ? 'visible' : 'none');
            }
        }

        /** 切换已加载 OBJ 模型的显示状态，并记录当前状态。 */
        function toggleModelVisible(visible) {
            console.log("切换模型显示隐藏....yyn");

            if (objModel) {
                objModel.visible = visible;
            }
            logMapState();
        }

        /** 将面板中的经纬度和高度转换为墨卡托坐标，作为模型的新定位点。 */
        function applyModelCenter() {
            if (!map || !objModel) return;

            const modelAsMercatorCoordinate = mapboxgl.MercatorCoordinate.fromLngLat(
                [modelCenterParams.x, modelCenterParams.y],
                modelCenterParams.z
            );

            modelTransform.translateX = modelAsMercatorCoordinate.x;
            modelTransform.translateY = modelAsMercatorCoordinate.y;
            modelTransform.translateZ = modelAsMercatorCoordinate.z;

            logMapState();
        }

        /**
         * 按米移动模型：先在墨卡托坐标中偏移，再同步回经纬度、高度和渲染变换。
         * dx、dy、dz 分别表示东西、南北和垂直方向的位移。
         */
        function moveModel(dx, dy, dz) {
            if (!map || !objModel) return;

            const currentMercator = mapboxgl.MercatorCoordinate.fromLngLat(
                [modelCenterParams.x, modelCenterParams.y],
                modelCenterParams.z
            );

            const scale = currentMercator.meterInMercatorCoordinateUnits();

            const newX = currentMercator.x + dx * scale;
            const newY = currentMercator.y + dy * scale;
            const newZ = currentMercator.z + dz * scale;

            const newMercator = new mapboxgl.MercatorCoordinate(newX, newY, newZ);
            const newLngLat = newMercator.toLngLat();

            modelCenterParams.x = newLngLat.lng;
            modelCenterParams.y = newLngLat.lat;
            modelCenterParams.z = newMercator.toAltitude();

            modelTransform.translateX = newX;
            modelTransform.translateY = newY;
            modelTransform.translateZ = newZ;

            logMapState();
        }

        /** 切换 Mapbox 底图样式，并在新样式就绪后重新添加自定义影像和地形。 */
        function changeBaseMap(styleName) {
            const styleUrl = baseMapStyles[styleName];
            if (styleUrl) {
                currentBaseMap = styleName;
                map.setStyle(styleUrl, {
                    preserve: ['camera', 'sprite'],
                });

                map.once('styledata', () => {
                    addImageLayer();
                    addTerrain();
                });
            }
        }

        /**
         * 创建 Mapbox Custom Layer：初始化 Three.js 场景、加载 OBJ，并在每帧将其绘制到地图画布。
         */
        function addCustomECEFObjLayer() {
            // 输出当前模型的地理坐标和海拔，便于确认初始化参数是否正确。
            console.log('addCustomECEFObjLayer:::yyn...',modelOrigin,modelAltitude);

            // 将经纬度和海拔转换为 Mapbox 使用的墨卡托坐标。
            const modelAsMercatorCoordinate = mapboxgl.MercatorCoordinate.fromLngLat(
                modelOrigin,
                modelAltitude
            );

            // 保存模型在地图坐标系中的平移、旋转与缩放参数，供每帧渲染时使用。
            modelTransform = {
                // 使用转换后的墨卡托坐标作为模型原点。
                translateX: modelAsMercatorCoordinate.x,
                translateY: modelAsMercatorCoordinate.y,
                translateZ: modelAsMercatorCoordinate.z,
                // 保存模型的初始旋转角度。
                rotateX: modelRotate.x,
                rotateY: modelRotate.y,
                rotateZ: modelRotate.z,
            };

            // 定义符合 Mapbox Custom Layer 规范的三维图层。
            customLayer = {
                // 图层的唯一标识。
                id: '3d-model',
                // 声明为自定义图层。
                type: 'custom',
                // 声明为 3D 渲染，使其参与地图的三维渲染流程。
                renderingMode: '3d',
                /** 图层加入地图时初始化 Three.js 渲染环境和 OBJ 模型。 */
                onAdd: function (map, gl) {
                    // 创建相机；投影矩阵会在 render 中由 Mapbox 的矩阵更新。
                    camera = new THREE.Camera();
                    // 创建承载灯光和 OBJ 模型的 Three.js 场景。
                    scene = new THREE.Scene();

                    // 添加第一盏平行光，为模型提供一个方向上的主光照。
                    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
                    // 设置光源位置并归一化方向向量。
                    directionalLight.position.set(0, -70, 100).normalize();
                    // 将主光源加入场景。
                    scene.add(directionalLight);

                    // 添加另一侧的平行光，减少模型背面的阴暗区域。
                    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 1.0);
                    // 设置第二盏平行光的位置并归一化其方向。
                    directionalLight2.position.set(0, 70, 100).normalize();
                    // 将第二盏平行光加入场景。
                    scene.add(directionalLight2);

                    // 添加环境光，为所有表面提供基础亮度。
                    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
                    // 将环境光加入场景。
                    scene.add(ambientLight);

                    // 创建 OBJ 加载器，用于读取本地三维模型文件。
                    const loader = new OBJLoader();
                    // 异步加载 OBJ 文件，并分别处理成功、进度和失败情况。
                    loader.load(
                        // 指定 OBJ 文件的相对路径。
                        "../落汤鸡/目标三维模型-精模/目标1三维模型-精模_ecef.obj",
                        (object) => {
                            console.log('object',object);
                            // 缓存已加载的模型对象，供其他交互逻辑使用。
                            objModel = object;
                            // 将每个 ENU 米单位顶点转换为自身对应的 Mercator 坐标，
                            // 不再使用原点处的单一 Mercator 比例尺缩放整个模型。
                            projectEnuVerticesToMercator(object);
                            // 遍历模型层级，为其中的网格统一设置材质和裁剪策略。
                            object.traverse((child) => {
                                if (child.isMesh) {
                                    // 使用标准材质，使网格能够响应场景中的灯光。
                                    child.material = new THREE.MeshStandardMaterial({
                                    // child.material = new THREE.MeshBasicMaterial({

                                        color: 0xffb52a,
                                        // 降低金属感，避免背光面的反射被压得过暗。
                                        roughness: 0.6,
                                        metalness: 0.05,
                                        // 少量自发光只用于抬亮暗部，仍保留灯光带来的立体感。
                                        emissive: 0x5a3100,
                                        emissiveIntensity: 0.35,
                                        // polygonOffset: true,
                                        // polygonOffsetFactor: -10,
                                        // polygonOffsetUnits: -100,
                                        // depthWrite: false
                                        // side: THREE.DoubleSide,
                                        depthTest: false,
                                    });
                                    // 关闭视锥裁剪，避免地图相机下模型被错误隐藏。
                                    child.frustumCulled = false;
                                }
                            });
                            // 将加载完成的模型添加到场景中。
                            scene.add(object);
                            // OBJ 完成加载后再应用一次精确坐标。这样即使 map 的 load
                            // 事件先发生、当时因 objModel 尚未就绪而跳过定位，也不会遗留初始偏移。
                            applyModelCenter();
                            // 记录加载成功信息。
                            console.log('OBJ model loaded successfully');
                            // 输出当前地图与模型状态，便于调试模型定位。
                            logMapState();
                        },
                        (xhr) => {
                            // 输出加载进度，便于观察较大模型的加载过程。
                            console.log('Loading OBJ model:', (xhr.loaded / xhr.total * 100) + '%');
                        },
                        (error) => {
                            // 输出加载异常，便于定位文件路径或格式问题。
                            console.error('Error loading OBJ model:', error);
                        }
                    );

                    // 保存地图实例，以便 render 中请求下一帧重绘。
                    this.map = map;

                    // 复用 Mapbox 的画布和 WebGL 上下文创建 Three.js 渲染器。
                    renderer = new THREE.WebGLRenderer({
                        canvas: map.getCanvas(),
                        context: gl,
                        antialias: true,
                    });

                    // 禁止 Three.js 自动清空画布，保留 Mapbox 已绘制的地图内容。
                    renderer.autoClear = false;
                },
                /** 每帧合成地图投影矩阵与模型变换矩阵，然后重绘 Three.js 场景。 */
                render: function (gl, matrix) {
                    // 创建绕 X 轴旋转的变换矩阵。
                    const rotationX = new THREE.Matrix4().makeRotationAxis(
                        new THREE.Vector3(1, 0, 0),
                        modelRotate.x
                    );
                    // 创建绕 Y 轴旋转的变换矩阵。
                    const rotationY = new THREE.Matrix4().makeRotationAxis(
                        new THREE.Vector3(0, 1, 0),
                        modelRotate.y
                    );
                    // 创建绕 Z 轴旋转的变换矩阵。
                    const rotationZ = new THREE.Matrix4().makeRotationAxis(
                        new THREE.Vector3(0, 0, 1),
                        modelRotate.z
                    );

                    // 将 Mapbox 提供的投影矩阵转换为 Three.js 的 Matrix4。
                    const m = new THREE.Matrix4().fromArray(matrix);
                    // 顶点已是相对原点的 Mercator 坐标，因此只保留旋转与整体定位。
                    const localRotation = new THREE.Matrix4()
                        .multiply(rotationX)
                        .multiply(rotationY)
                        .multiply(rotationZ);
                    // 组合为：地图平移 × 模型旋转。这里刻意不再包含统一缩放或 Y 轴翻转。
                    const l = new THREE.Matrix4()
                        .makeTranslation(
                            modelTransform.translateX,
                            modelTransform.translateY,
                            modelTransform.translateZ
                        )
                        .multiply(localRotation);

                        

                    // 合并地图投影与模型局部变换，作为 Three.js 相机的投影矩阵。
                    camera.projectionMatrix = m.multiply(l);
                    // 重置 Three.js 的 WebGL 状态，避免与 Mapbox 的状态相互干扰。
                    renderer.resetState();
                    // 使用共享画布将 Three.js 场景绘制到当前地图帧中。
                    renderer.render(scene, camera);
                    // 请求 Mapbox 继续重绘，以支持相机移动和模型参数实时更新。
                    this.map.triggerRepaint();
                },
            };

            // 将定义好的自定义三维图层注册到 Mapbox 地图中。
            map.addLayer(customLayer);
        }

        /** 创建 lil-gui 控制面板，用于实时调整底图、图层、模型位置/旋转和地形。 */
        function addGUI() {
            const gui = new lil.GUI();
            gui.width = 300;

            const baseMapOptions = gui.addFolder('Base Map');
            baseMapOptions.add({ style: currentBaseMap }, 'style', Object.keys(baseMapStyles)).name('底图样式').onChange(changeBaseMap);
            baseMapOptions.open();

            const layerOptions = gui.addFolder('Layer Visibility');
            layerOptions.add(layerVisibility, 'imageLayer').name('Image Layer').onChange(toggleImageLayer);
            layerOptions.add(layerVisibility, 'modelVisible').name('Model').onChange(toggleModelVisible);
            layerOptions.open();

            const modelCenterOptions = gui.addFolder('Model Center');
            modelCenterOptions.add(modelCenterParams, 'x').name('X').step(0.0001);
            modelCenterOptions.add(modelCenterParams, 'y').name('Y').step(0.0001);
            modelCenterOptions.add(modelCenterParams, 'z').name('Z').step(0.1);
            modelCenterOptions.add({ apply: applyModelCenter }, 'apply').name('应用');
            modelCenterOptions.open();

            const modelMoveOptions = gui.addFolder('Model Position');
            modelMoveOptions.add(modelMoveParams, 'step').name('步长 (m)').min(0.1).max(100).step(0.1);
            modelMoveOptions.add(modelMoveParams, 'moveForward').name('前');
            modelMoveOptions.add(modelMoveParams, 'moveBackward').name('后');
            modelMoveOptions.add(modelMoveParams, 'moveUp').name('上');
            modelMoveOptions.add(modelMoveParams, 'moveDown').name('下');
            modelMoveOptions.add(modelMoveParams, 'moveLeft').name('左');
            modelMoveOptions.add(modelMoveParams, 'moveRight').name('右');
            modelMoveOptions.open();

            const modelRotateOptions = gui.addFolder('Model Rotation');
            modelRotateOptions.add(modelRotate, 'x').name('Rotate X').min(-Math.PI).max(Math.PI).step(0.01);
            modelRotateOptions.add(modelRotate, 'y').name('Rotate Y').min(-Math.PI).max(Math.PI).step(0.01);
            modelRotateOptions.add(modelRotate, 'z').name('Rotate Z').min(-Math.PI).max(Math.PI).step(0.01);
            modelRotateOptions.open();

            const terrainOptions = gui.addFolder('Terrain Options');
            terrainOptions.add(terrainParams, 'enabled').name('Terrain').onChange(toggleTerrain);
            terrainOptions.add(terrainParams, 'exaggeration').name('Exaggeration').min(0).max(5).step(0.1).onChange(updateTerrainExaggeration);
            terrainOptions.open();

            gui.open();
        }
        // ================= Terrain cover 对比诊断（旧/新文件保持完全一致） =================
        // 控制台手动执行：terrainCoverDiag()
        // 重点用来比较：style / projection / worldSize / coveringZoomLevel /
        // proxySource tileSize / 当前 proxy z-x-y / drapeRenderMode / DEM renderable tiles。
        function logTerrainCoverDiagnostics(reason = 'manual') {
            // 没有地图实例时无法读取内部 terrain 状态；返回 null 表示本次没有输出诊断结果。
            if (!map) return null;

            // 获取地图坐标变换对象：其中保存 zoom、投影、worldSize、瓦片覆盖层级等相机相关数据。
            const transform = map.transform;
            // 获取 Mapbox 内部的 Terrain 对象：其中保存 DEM 缓存、proxy 缓存和当前帧 terrain 状态。
            const terrain = map.painter?._terrain;
            // 获取 terrain 的 proxy 瓦片缓存：proxy 是地形渲染阶段使用的工作瓦片，不是 DEM 数据瓦片。
            const proxySourceCache = terrain?.proxySourceCache;
            // 从 proxy 缓存取得其 source 定义：用于读取 proxy 的 tileSize、minzoom 等配置。
            const proxySource = proxySourceCache?.getSource?.();
            // 取得 proxy 缓存当前持有的全部瓦片 ID；数组长度就是该缓存中 proxy 的数量。
            const proxyIds = proxySourceCache?.getIds?.() || [];
            // 读取 proxy source 的瓦片像素尺寸；最终会输出到 snapshot.proxySourceTileSize。
            const proxyTileSize = proxySource?.tileSize;

            // 组装 transform.coveringZoomLevel() 所需参数；它用于计算当前相机下 proxy source 建议覆盖的层级。
            const coveringOptions = proxySource ? {
                tileSize: proxySource.tileSize, // 输入：proxy 单张瓦片尺寸。
                minzoom: proxySource.minzoom, // 输入：proxy source 允许的最低层级。
                maxzoom: proxySource.maxzoom, // 输入：proxy source 允许的最高层级。
                roundZoom: proxySource.roundZoom, // 输入：是否将覆盖层级取整。
            } : null;

            // 默认输出“不可用”；当内部 API 不存在或 source 未创建时保留该值。
            let coveringZoomLevel = '不可用';
            try {
                // 确认参数和内部函数都存在后，计算当前相机、投影和 tileSize 对应的覆盖 zoom。
                if (coveringOptions && typeof transform?.coveringZoomLevel === 'function') {
                    // 输出：proxy source 在当前视图下的理论覆盖层级（不等同于实际 proxy 数量）。
                    coveringZoomLevel = transform.coveringZoomLevel(coveringOptions);
                }
            } catch (error) {
                // 输出：调用内部函数异常时记录错误文字，避免诊断函数整体中断。
                coveringZoomLevel = `读取失败: ${error?.message || error}`;
            }

            // 将每个 proxy ID 转成便于 console.table 查看的 z/x/y 明细行。
            const proxyRows = proxyIds.map((id) => {
                // 用 ID 从 proxy 缓存取瓦片实例；可取得实际 tileID。
                const tile = proxySourceCache?.getTileByID?.(id);
                // 优先使用瓦片实例携带的 tileID；取不到时回退使用原始 ID。
                const tileID = tile?.tileID || id;
                // canonical 是标准世界内的 z/x/y；不包含世界复制（wrap）和 overscale 信息。
                const canonical = tileID?.canonical;
                // 输出：一条 proxy 瓦片的 key、渲染层级、数据层级和空间坐标。
                return {
                    key: tileID?.key ?? id, // 输出：Mapbox 用于标识该瓦片的唯一 key。
                    overscaledZ: tileID?.overscaledZ ?? canonical?.z ?? null, // 输出：实际参与渲染的层级。
                    canonicalZ: canonical?.z ?? null, // 输出：标准 z/x/y 坐标中的数据层级。
                    x: canonical?.x ?? null, // 输出：标准瓦片列号。
                    y: canonical?.y ?? null, // 输出：标准瓦片行号。
                    wrap: tileID?.wrap ?? 0, // 输出：世界横向重复次数，0 表示原始世界。
                };
            });

            // 创建分组表：用于统计同一帧是否同时存在多个 proxy zoom，以及每组的空间覆盖范围。
            const proxyZoomGroups = new Map();
            // 逐条处理刚刚生成的 proxy z/x/y 明细。
            for (const row of proxyRows) {
                // 以“渲染 z / 标准 z”作为分组键，避免 overscaled 与 canonical 层级混在一起。
                const key = `render z${row.overscaledZ} / canonical z${row.canonicalZ}`;
                // 获取已有分组；第一次遇到该层级组合时创建初始统计对象。
                const group = proxyZoomGroups.get(key) || {
                    zoom: key, // 输出：该组的“渲染 z / 标准 z”名称。
                    tiles: 0, // 输出：该组 proxy 数量，下面每处理一条加 1。
                    minX: row.x, // 输出：该组最小 x，初始值为第一张瓦片的 x。
                    maxX: row.x, // 输出：该组最大 x，初始值为第一张瓦片的 x。
                    minY: row.y, // 输出：该组最小 y，初始值为第一张瓦片的 y。
                    maxY: row.y, // 输出：该组最大 y，初始值为第一张瓦片的 y。
                };
                // 累加当前 zoom 组的 proxy 数量。
                group.tiles += 1;
                // x 有效时，更新该组的最小/最大列号，输出该组横向覆盖范围。
                if (row.x != null) {
                    group.minX = group.minX == null ? row.x : Math.min(group.minX, row.x);
                    group.maxX = group.maxX == null ? row.x : Math.max(group.maxX, row.x);
                }
                // y 有效时，更新该组的最小/最大行号，输出该组纵向覆盖范围。
                if (row.y != null) {
                    group.minY = group.minY == null ? row.y : Math.min(group.minY, row.y);
                    group.maxY = group.maxY == null ? row.y : Math.max(group.maxY, row.y);
                }
                // 将本轮更新后的统计结果写回 Map，最终输出为 proxyZoomSummary 表。
                proxyZoomGroups.set(key, group);
            }

            // 获取 terrain 绑定的真实 DEM source cache；它对应 local-model-dem，而不是 proxy source。
            const demSourceCache = terrain?.sourceCache;
            // 读取当前可绘制的 DEM 瓦片 ID；输出数量用于与 proxy 数量比较。
            const demRenderableIds = demSourceCache?.getRenderableIds?.() || [];
            // 将每张可绘制 DEM 瓦片也转换为 z/x/y 明细，便于确认 DEM 是否已稳定在 maxzoom。
            const demRows = demRenderableIds.map((id) => {
                // 用 DEM 瓦片 ID 从 DEM 缓存读取瓦片实例。
                const tile = demSourceCache?.getTileByID?.(id);
                // 优先使用瓦片实例的 tileID；不存在时使用原 ID。
                const tileID = tile?.tileID || id;
                // 读取 DEM 瓦片的标准 z/x/y 坐标。
                const canonical = tileID?.canonical;
                // 输出：一条可绘制 DEM 瓦片的渲染层级、数据层级和空间坐标。
                return {
                    overscaledZ: tileID?.overscaledZ ?? canonical?.z ?? null, // 输出：DEM 实际渲染层级。
                    canonicalZ: canonical?.z ?? null, // 输出：DEM 标准数据层级。
                    x: canonical?.x ?? null, // 输出：DEM 标准瓦片列号。
                    y: canonical?.y ?? null, // 输出：DEM 标准瓦片行号。
                    wrap: tileID?.wrap ?? 0, // 输出：DEM 世界横向重复次数。
                };
            });

            // 初始化投影结果；Mapbox 版本差异可能使投影 API 位于不同对象上。
            let projection = null;
            try {
                // 优先读取公开 map.getProjection()；没有时再尝试 transform 的内部读取方法。
                projection = map.getProjection?.() || transform?.getProjection?.() || null;
            } catch (_) {
                // 读取 API 异常时，只输出 transform 内部投影名称，保证日志仍然可用。
                projection = transform?.projection ? {name: transform.projection.name} : null;
            }

            // 汇总输出：一行概览，用于两份日志直接横向比较。
            const snapshot = {
                reason, // 输出：此次日志触发原因，例如 moveend 或 manual console。
                styleName: map.getStyle?.()?.name || '未命名', // 输出：当前 style 名称。
                styleImports: map.getStyle?.()?.imports?.map((item) => item.id).join(', ') || '无', // 输出：style import ID，例如 Standard 的 basemap。
                zoom: Number(map.getZoom().toFixed(4)), // 输出：当前地图 zoom，保留 4 位小数。
                tileZoom: transform?.tileZoom, // 输出：Mapbox 内部用于瓦片选择的整型 tile zoom。
                pitch: Number(map.getPitch().toFixed(2)), // 输出：当前俯仰角。
                bearing: Number(map.getBearing().toFixed(2)), // 输出：当前旋转角。
                center: map.getCenter().toArray().map((v) => Number(v.toFixed(8))).join(', '), // 输出：当前中心经纬度。
                projection: projection?.name || transform?.projection?.name || '未知', // 输出：当前地图投影名称。
                isOrthographic: transform?.isOrthographic ?? '未知', // 输出：当前是否使用正交投影路径。
                orthographicAtLowPitch: transform?._orthographicProjectionAtLowPitch ?? '未知', // 输出：低 pitch 时是否切换正交投影的内部开关。
                worldSize: transform?.worldSize, // 输出：当前 zoom 下整个世界的内部像素尺寸。
                coveringZoomLevel, // 输出：根据 proxy source 参数计算出的理论覆盖层级。
                proxySourceTileSize: proxyTileSize ?? '未知', // 输出：proxy source 的单张瓦片尺寸。
                proxySourceMinZoom: proxySource?.minzoom ?? '未知', // 输出：proxy source 的最低层级。
                proxySourceMaxZoom: proxySource?.maxzoom ?? '未知', // 输出：proxy source 的最高层级。
                proxySourceRoundZoom: proxySource?.roundZoom ?? '未知', // 输出：proxy source 是否对覆盖层级取整。
                proxySourceGetIdsCount: proxyIds.length, // 输出：proxySourceCache.getIds() 返回的 proxy 总数。
                terrainProxyCoordsCount: terrain?.proxyCoords?.length ?? '未知', // 输出：Terrain 当前帧最终使用的 proxyCoords 数量。
                terrainDrapeMode: map.style?.terrain?.drapeRenderMode ?? '未知', // 输出：0=deferred，1=elevated 的内部 terrain 路径。
                elevationSourceCache: terrain?.sourceCache?.id ?? '未知', // 输出：当前 terrain 实际绑定的 DEM source cache ID。
                terrainUsingMockSource: terrain?.isUsingMockSource?.() ?? '未知', // 输出：terrain 是否正在使用内部 mock source。
                demRenderableTiles: demRenderableIds.length, // 输出：当前可绘制 DEM 瓦片数量。
                visibleDemTiles: terrain?._visibleDemTiles?.length ?? '未知', // 输出：Terrain 标记为可见的 DEM 瓦片数量。
            };

            // 输出分组标题：把同一次诊断的多张表折叠到同一个控制台组中。
            console.group(`[terrain cover diag] ${reason} | ${snapshot.styleName} | z${snapshot.zoom}`);
            // 输出概览表：包含 style、相机、投影、proxy 与 DEM 数量等核心指标。
            console.table(snapshot);
            // 输出完整投影对象：用于查看投影的额外内部参数。
            console.log('projection object:', projection);
            // 输出计算 coveringZoomLevel 时使用的 proxy source 参数。
            console.log('covering options (proxy source):', coveringOptions);
            // 输出完整 proxy 缓存对象：仅供需要查看 Mapbox 内部字段时展开。
            console.log('proxySourceCache:', proxySourceCache);
            // 输出完整 Terrain 对象：可展开查看 proxyCoords、sourceCache 等内部状态。
            console.log('terrain:', terrain);
            // 输出文字说明：下面表格是所有 proxy 的逐瓦片 z/x/y 明细。
            console.log(`proxy getIds() 明细，共 ${proxyRows.length} 个：`);
            // 输出 proxy 明细表：每行是一张 proxy 瓦片。
            console.table(proxyRows);
            // 输出文字说明：下面表格按“渲染 z / 标准 z”汇总 proxy 数和空间范围。
            console.log('proxy 按 zoom 分组：');
            // 输出 proxy 汇总表：用来判断多层级混用还是单层级空间覆盖扩大。
            console.table([...proxyZoomGroups.values()]);
            // 输出文字说明：下面表格是可绘制 DEM 的逐瓦片 z/x/y 明细。
            console.log(`DEM renderable 明细，共 ${demRows.length} 个：`);
            // 输出 DEM 明细表：用于对照 DEM 数量是否稳定而 proxy 是否仍增长。
            console.table(demRows);
            // 结束本次控制台分组输出。
            console.groupEnd();

            // 返回结构化结果：控制台调用 terrainCoverDiag() 时也能在代码中继续查看这些数据。
            return {
                snapshot, // 返回：概览指标对象。
                projection, // 返回：完整投影对象。
                coveringOptions, // 返回：计算理论覆盖层级所用的 proxy 参数。
                proxyRows, // 返回：全部 proxy z/x/y 明细。
                proxyZoomSummary: [...proxyZoomGroups.values()], // 返回：按 zoom 汇总的 proxy 数量与 x/y 范围。
                demRows, // 返回：全部可绘制 DEM z/x/y 明细。
            };
        }

        function installTerrainCoverDiagnostics() {
            if (!map || map.__terrainCoverDiagInstalled) return;
            map.__terrainCoverDiagInstalled = true;

            window.terrainCoverDiag = () => logTerrainCoverDiagnostics('manual console');

            // 只在状态稳定时打印，避免 zoom/move 过程中刷屏并影响测试结果。
            map.on('moveend', () => logTerrainCoverDiagnostics('moveend'));
            // map.on('idle', () => logTerrainCoverDiagnostics('idle'));

            console.log('Terrain cover 对比日志已安装。控制台可执行 terrainCoverDiag()。');
        }
        // ================= Terrain cover 对比诊断结束 =================

        init();
    </script>

</body>
